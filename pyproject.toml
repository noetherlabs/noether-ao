[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "noether-optics"
version = "0.1.0"
description = "Reproducible civil-astronomy adaptive-optics experiments"
requires-python = ">=3.11,<3.13"
dependencies = ["jax", "jaxlib", "dLux", "zodiax", "equinox", "optax", "numpy", "scipy", "matplotlib", "pyyaml", "psutil", "hcipy", "pytest"]

[project.scripts]
noether-optics = "noether_optics.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
