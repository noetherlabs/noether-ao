name: Correctness

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: correctness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install pinned environment
        run: |
          python -m pip install uv==0.13.7
          uv sync --locked --extra receiver --python 3.11
      - name: Verify the optional receiver is installed
        run: .venv/bin/python -c 'import noether_physics, noether_optics.receiver'
      - name: Run correctness tests (no latency measurements)
        run: .venv/bin/python -m pytest -q --junitxml=correctness.xml
      - name: Require the receiver conformance suite
        run: |
          .venv/bin/python - <<'PYTHON'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse("correctness.xml").iter("testcase"))
          required = {"test_receiver": 50, "test_receiver_calibration": 91,
                      "test_receiver_calibration_runner": 25,
                      "test_receiver_calibration_audit": 20}
          for module, minimum in required.items():
              selected = [case for case in cases
                          if case.get("classname", "").split(".")[-1] == module]
              assert len(selected) >= minimum, f"Missing receiver tests: {module}"
              assert all(case.find(tag) is None for case in selected
                         for tag in ("skipped", "failure", "error"))
          PYTHON
