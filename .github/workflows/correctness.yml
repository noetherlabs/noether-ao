name: Correctness

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: correctness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install pinned environment
        run: |
          python -m pip install uv==0.10.10
          uv sync --frozen --python 3.11
      - name: Run correctness tests (no latency measurements)
        run: .venv/bin/python -m pytest -q
